# =============================================================
# CertiFlow - Nginx Configuration (inside Docker)
# Single entry point on port 80.
# The server's app25.conf proxies everything here via 127.0.0.1:8080
# =============================================================

client_max_body_size 50M;

server {
    listen 80;
    server_name localhost;

    # Docker's internal DNS — resolves container names lazily (not at startup)
    resolver 127.0.0.11 valid=30s ipv6=off;

    # ─── Apprenant Frontend (root) ────────────────────────────
    location / {
        set $apprenant_upstream http://service-apprenant:6175;
        proxy_pass $apprenant_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── Admin Frontend ───────────────────────────────────────
    location = /admin {
        return 301 /admin/;
    }
    location /admin/ {
        set $admin_upstream http://service-admin:6173;
        proxy_pass $admin_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── Formateur Frontend ───────────────────────────────────
    location = /formateur {
        return 301 /formateur/;
    }
    location /formateur/ {
        set $formateur_upstream http://service-formateur:6174;
        proxy_pass $formateur_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── Coordinateur Frontend ────────────────────────────────
    location = /coordinateur {
        return 301 /coordinateur/;
    }
    location /coordinateur/ {
        set $coordinateur_upstream http://service-coordinateur:6176;
        proxy_pass $coordinateur_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── Backend APIs (all through /api/* paths) ──────────────

    location ~ ^/api/admin/(.*)$ {
        set $backend_admin_host "backend-admin";
        proxy_pass http://$backend_admin_host:9091/$1$is_args$args;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── Formateur AI (longer timeout for Ollama CPU inference) ──
    location ~ ^/api/formateur/api/v1/ai/(.*)$ {
        set $backend_formateur_host "backend-formateur";
        proxy_pass http://$backend_formateur_host:9092/api/v1/ai/$1$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_connect_timeout 30s;
        proxy_send_timeout 600s;
        # SSE streaming: never buffer AI responses, flush frames immediately
        proxy_buffering off;
        proxy_cache off;
        gzip off;
    }

    location ~ ^/api/formateur/(.*)$ {
        set $backend_formateur_host "backend-formateur";
        proxy_pass http://$backend_formateur_host:9092/$1$is_args$args;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
    }

    location ~ ^/api/apprenant/(.*)$ {
        set $backend_apprenant_host "backend-apprenant";
        proxy_pass http://$backend_apprenant_host:9093/$1$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/coordinateur/(.*)$ {
        set $backend_coordinateur_host "backend-coordinateur";
        proxy_pass http://$backend_coordinateur_host:9094/$1$is_args$args;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/ai/(.*)$ {
        set $ai_service_host "ai-detection-service";
        proxy_pass http://$ai_service_host:8000/$1$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 600s;
        proxy_connect_timeout 30s;
        proxy_send_timeout 600s;
        # SSE streaming: never buffer AI responses, flush frames immediately
        proxy_buffering off;
        proxy_cache off;
        gzip off;
    }

    # ─── WebSocket ────────────────────────────────────────────
    location /ws {
        set $backend_apprenant_host "backend-apprenant";
        proxy_pass http://$backend_apprenant_host:9093/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── LiveKit WebRTC ───────────────────────────────────────
    # Strip /livekit prefix: /livekit/rtc/v1/... → /rtc/v1/...
    location /livekit {
        rewrite ^/livekit(/.*)$ $1 break;
        set $livekit_upstream http://livekit:7880;
        proxy_pass $livekit_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
