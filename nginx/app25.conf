# =============================================================
# app25.conf  —  Server-side Nginx Virtual Host
# Place this file at: /etc/nginx/sites-available/app25.conf
# (symlink to /etc/nginx/sites-enabled/ or include directly)
#
# Architecture:
#   Internet --https:443--> pfs (reverse proxy) --http:80--> this server
#   This server --port 80--> Docker nginx (127.0.0.1:8080)
#   Docker nginx --> all frontends & backends internally
#
# IMPORTANT: Docker must be running with:
#   docker compose up -d
# (Docker nginx listens on 127.0.0.1:8080)
# =============================================================

client_max_body_size 50M;

server {
    listen 80;
    server_name app25.ens-marrakech.ac.ma www.ens-marrakech.ac.ma;

    # Forward everything to Docker's internal nginx
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
    }
}
